spring:
  application:
    name: mett-hdr-api
  flyway:
    enabled: false

server:
  port: ${HDR_API_PORT:8080}

mett:
  hdr:
    global-id:
      strategy: uuid
    request-id:
      header-name: X-Request-Id
    storage:
      provider: ${HDR_STORAGE_PROVIDER:local}
    integration:
      evaluation:
        enabled: false
    auth:
      jwt:
        signing-secret: ${HDR_JWT_SIGNING_SECRET:local-development-signing-key-change-me}
        access-token-ttl-seconds: ${HDR_ACCESS_TOKEN_TTL_SECONDS:3600}
      refresh-token-ttl-seconds: ${HDR_REFRESH_TOKEN_TTL_SECONDS:2592000}
      refresh-cookie:
        secure: ${HDR_REFRESH_COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} %logger{36} - %msg%n"
