spring:
  application:
    name: mett-hdr-api
  flyway:
    enabled: false

server:
  port: ${HDR_API_PORT:8080}

mett:
  hdr:
    global-id:
      strategy: uuid
    request-id:
      header-name: X-Request-Id
    storage:
      provider: ${HDR_STORAGE_PROVIDER:local}
    integration:
      evaluation:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} %logger{36} - %msg%n"
